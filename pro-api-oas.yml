  /contract-orders/v1:
    post:
      description: |
        `https://api.procurement.opengov.com/gateway/contract-orders/v1/`
      tags:
        - Contract Orders
      summary: Import Contract Orders
      operationId: importContractOrders
      security:
        - basicAuth: []
        - apiKeyAuth: []
      requestBody:
        description: A JSON array of Contract Orders to be imported.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ContractOrder'
      responses:
        '200':
          description: Successfully updated one or more Contract Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdCount:
                    type: integer
                    example: 1
                    description: Number of Contract Orders created.
                  updatedCount:
                    type: integer
                    example: 1
                    description: Number of Contract Orders updated.
                  erroredContractOrders:
                    type: array
                    description: List of Contract Orders that encountered errors.
                    items:
                      $ref: '#/components/schemas/ErroredContractOrder'
        '201':
          description: Successfully created one or more Contract Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdCount:
                    type: integer
                    example: 1
                    description: Number of Contract Orders created.
                  updatedCount:
                    type: integer
                    example: 1
                    description: Number of Contract Orders updated.
                  erroredContractOrders:
                    type: array
                    description: List of Contract Orders that encountered errors.
                    items:
                      $ref: '#/components/schemas/ErroredContractOrder'
        '400':
          description: Bad request, invalid or empty body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No valid contract orders to import
                  erroredContractOrders:
                    type: array
                    description: List of Contract Orders that encountered errors.
                    items:
                      $ref: '#/components/schemas/ErroredContractOrder'
        '401':
          description: Unauthorized, invalid or missing token.
        '403':
          description: Forbidden, user does not have permission to import contract orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Only contract admins can import contract orders
        '404':
          description: Not Found, feature is not available in this environment.
        '500':
          description: Internal server error.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Contract:
      x-tags:
        - Datasets
      type: object
      properties:
        vendor_name:
          type: string
          description: >
            If vendor subscriber is chosen as the Associated Vendor during
            contract record creation, this will be the company name from the
            vendor's company profile.


            If no vendor subscriber is chosen, this is the Vendor Name as entered into the new contract form.
          example: Acme Corp
        vendor_email:
          type: string
          description: >
            If vendor subscriber is chosen as the Associated Vendor during
            contract creation, this is copied from that vendor subscriber's user
            profile.


            If no vendor subscriber is chosen, this is the Vendor Email as entered into the new contract form.
          example: contact@acme.nil
        vendor_city:
          type: string
          description: Vendor company city; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: New York
        vendor_state:
          type: string
          description: Vendor company state; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: NY
        vendor_country:
          type: string
          description: Vendor company country; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: USA
        vendor_zip_code:
          type: string
          description: Vendor company zip code; only available when vendor subscriber is
            chosen as the Associated Vendor during contract creation.
          example: 10001
        vendor_number:
          type: string
          description: The optional Vendor Assigned Number that identifies the Vendor in
            your ERP.
          example: ACME-001
        internal_contract_id:
          type: integer
          description: The internal OpenGov contract ID.
          example: 456
        contract_title:
          type: string
          description: The title of the contract.
          example: Office Supplies Contract
        contract_id:
          type: string
          description: The public-facing contract ID or code.
          example: CON-789
        requisition_id:
          type: string
          description: The requisition ID.
          example: REQ-101
        term_type:
          type: string
          description: 'One of: Limited Term, Continuous, or Upon Completion.'
          example: Continuous
        status:
          type: string
          description: 'One of: upcoming, active, ended.'
          example: active
        start_date:
          type: string
          format: date
          description: The start date of the contract. Date in UTC.
          example: 2024-01-01
        end_date:
          type: string
          format: date
          description: The end date of the contract. Date in UTC.
          example: 2024-12-31
        initial_term_length:
          type: integer
          description: The initial term length of the contract.
          example: 12
        initial_term_unit:
          type: string
          description: 'The unit of the initial term length. One of: years, months, weeks,
            days'
          example: Months
        has_renewal_option:
          type: boolean
          description: If any renewal options have not been activated, value is 1.
            Otherwise 0.
          example: 1
        renewals:
          type: integer
          description: Count of all renewal options (both activated and not activated).
          example: 2
        renewals_remaining:
          type: integer
          description: Count of renewal options that have not been activated.
          example: 1
        contract_amount:
          type: number
          format: double
          description: The total amount of the contract.
          example: 10000
        amount_spent:
          type: number
