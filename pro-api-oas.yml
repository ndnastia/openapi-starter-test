---
openapi: 3.1.0
info:
  version: 1.0.0
  title: Procurement APIs
  x-logo:
    url: https://assets.procurement.opengov.com/brand/pro-logo-padded.png
  description: OpenGov Procurement API
servers:
  - url: https://api.procurement.opengov.com/gateway
    description: Production
security:
  - basicAuth: []
  - apiKeyAuth: []
tags:
  - name: Introduction
    description: >
      The OpenGov Procurement API is organized around REST. The API is
      based on the JSON API specification and uses standard HTTP response codes,
      authentication, and verbs.


      The API base URL is `https://api.procurement.opengov.com/gateway`
  - name: Authentication
    description: >
      ### Authentication


      The OpenGov Procurement API supports two ways to authenticate each request over HTTPS.


      #### 1. HTTP Basic Auth (preferred)


      Use your OpenGov account email as the username and your API key as the password.


      ```bash
      curl -u "alice@example.com:YOUR_API_KEY" \
      https://api.procurement.opengov.com/gateway/datasets/v1/solicitations
      ```

      #### 2. X-api-key header


      You may also authenticate using the `x-api-key` request header:

      ```bash
      curl -H "x-api-key: YOUR_API_KEY" \
      https://api.procurement.opengov.com/gateway/datasets/v1/solicitations
      ```

      > **Security note:** Some third-party systems may log or store custom headers in plaintext.  

      > Because many platforms automatically mask the standard `Authorization` header,  

      > Basic Auth is the recommended method whenever possible.


      To obtain an API key, please follow the steps outlined in this guide [OpenGov Procurement API Reference](https://opengov.my.site.com/support/s/article/87a452ae-254c-4b62-8336-d475c2e30723) or contact OpenGov support.


      The API will return a 401 error if the key is invalid.
  - name: Errors
    description: >+
      OpenGov uses conventional HTTP response codes to indicate the
      success or failure of an API request. 


      In general, codes in the `2xx` range indicate success, codes in the `4xx` range indicate a client-side error, and codes in the `5xx` range indicate a server-side error.


      For any error, the API will return an error code and detail message.

      <SchemaDefinition schemaRef="#/components/schemas/Error" />

  - name: Datasets
    description: >
      **Datasets** are collections of data that can be retrieved using
      the API.


      Datasets can be retrieved by using `GET` requests. The base url for datasets is `https://api.procurement.opengov.com/gateway/datasets/v1/`


      Note: All dates and times returned by this API are in the time zone selected by the agency.
  - name: Contract Orders
    description: >
      **Contract Orders** are attached to Contracts to track spending
      against a Budget.


      The base url for Contract Orders is `https://api.procurement.opengov.com/gateway/contract-orders/v1/`
